global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert rules (Step 6)
rule_files:
  - "/etc/prometheus/rules/ml_alerts.yml"

scrape_configs:
  - job_name: 'ml-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['ml-app:9999']

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'model-training'
    scrape_interval: 5s
    static_configs:
      - targets:
        - 'ml-app:8002'   # Train monitor runs inside ml-app container
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 3s
