global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/ml_alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ml-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:9999']
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 3s

  - job_name: 'model-training'
    scrape_interval: 5s
    static_configs:
      - targets: 
        - 'training-metrics:8002'
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 3s

